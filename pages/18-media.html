<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: sans-serif; padding: 1; }
  h3 { margin-bottom: 4px; }
  /* 默认 (无 media): 桌面样式 */
  .screen-info { border: 1px solid #888; padding: 1px; margin-bottom: 2px; }
  .wide-label { display: none; }
  .narrow-label { display: none; }

  @media (min-width: 60) {
    .wide-label { display: block; color: #4A9EFF; font-weight: bold; }
  }

  @media (max-width: 59) {
    .narrow-label { display: block; color: #d44545; font-weight: bold; }
  }

  /* 组合查询 */
  @media (min-width: 40) and (max-width: 100) {
    .mid-range { border-color: #f1c40f; background-color: #332f1a; }
  }
</style></head><body>
  <h3>18-media — @media 查询</h3>
  <div class="screen-info">base info</div>
  <div class="wide-label">WIDE MODE (>=60)</div>
  <div class="narrow-label">NARROW MODE (<=59)</div>
  <div class="mid-range">mid range (40-100)</div>
  <p><button id="btn-back">Back to Menu</button></p>
</body></html>
