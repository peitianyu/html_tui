<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  .grid { display: grid; grid-template-columns: 30 20 1fr; gap: 1; }
  .item { background-color: #4466aa; color: #ffffff; }
  .wide { display: grid; grid-template-columns: 1fr 1fr; gap: 1; }
</style></head><body>
  <h3>26-grid — CSS Grid</h3>
  <div class="grid">
    <div class="item">G1</div><div class="item">G2</div><div class="item">G3</div>
    <div class="item">G4</div><div class="item">G5</div><div class="item">G6</div>
  </div>
  <p>均分列 (1fr 1fr):</p>
  <div class="wide">
    <div class="item">W1</div><div class="item">W2</div><div class="item">W3</div>
  </div>
  <p><button id="btn-back">Back</button></p>
</body></html>
